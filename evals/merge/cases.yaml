# Merge eval: made-up candidates, each with several resume versions (rendered to PDFs by
# scripts/merge_eval.py) and an answer key. See docs/merge-guide.md for the rules graded.
#
# Key fields:
#   once:     each entry is one fact; any of its phrases may word it; it must appear on exactly one line.
#   keep:     phrases that must be present (the fuller wording, details only one version has).
#   absent:   phrases that must not be present (the older side of a conflict).
#   skills:   each must appear exactly once in the skills section.
#   first_section_is_summary: the merged resume opens with a summary-type section.

