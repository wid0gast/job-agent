[project]
name = "job-agent"
version = "0.1.0"
description = "A local agent that finds jobs, tailors documents and applies with you in the loop."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pyyaml>=6,<7",
  "markdown>=3.6,<4",
  "keyring>=25,<26",
  "pypdf>=5,<7",
  "cryptography>=42",
  "anthropic>=1.15.0",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent"]
