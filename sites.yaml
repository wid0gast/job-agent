# Job sites the search agent starts from. Add, remove or edit freely.
# {query} and {location} are filled in from your request (URL-encoded).
# Search URLs are starting points; the agent can refine filters on the page.

linkedin:
  name: LinkedIn
  login_url: https://www.linkedin.com/login
  search_url: "https://www.linkedin.com/jobs/search/?keywords={query}&location={location}&f_TPR=r604800"
  notes: >
    Prefer postings with Easy Apply. LinkedIn restricts automated activity,
    so keep daily volume low and keep SUBMIT_MODE=review here.

handshake:
  name: Handshake
  login_url: https://app.joinhandshake.com/login
  search_url: "https://app.joinhandshake.com/stu/postings?query={query}"
  notes: >
    Students sign in through their school's single sign-on, so the user logs
    in manually. Many postings apply inside Handshake; others link out.

jobright:
  name: Jobright
  login_url: https://jobright.ai/
  search_url: "https://jobright.ai/jobs"
  notes: >
    Shows recommended jobs based on the user's Jobright profile. Postings
    usually link out to the employer's application system.

demo:
  name: Local demo board
  login_url: http://127.0.0.1:8765/
  search_url: "http://127.0.0.1:8765/?q={query}"
  notes: >
    A fake job board and application system for safe testing. Start it with
    `uv run job-agent demo-site` in another terminal.
